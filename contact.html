    <section class="hero" style="padding-top: 80px; padding-bottom: 40px;">
      <div class="boxed">
        <span class="eyebrow">📬 Contact</span>
        <h1 class="overview" style="font-size: 3rem;">Let's build something.</h1>
      </div>
    </section>

    <section id="contact" style="padding-top: 0;">
      <div class="boxed contact-grid">
        <form
          class="contact-form reveal"
          name="contact"
          action="index.html"
          method="POST"
          data-netlify="true"
          netlify-honeypot="bot-field"
        >
          <input type="hidden" name="form-name" value="contact" />
        
          <p hidden>
            <label>Don't fill this out:
              <input name="bot-field" />
            </label>
          </p>
        
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required />
          </div>
        
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>
        
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
        
          <button type="submit">Send message →</button>
        </form>

        <div class="contact-direct reveal" style="transition-delay: 0.1s">
          <h2 class="section-heading is-visible" style="opacity:1; transform:none;">Direct</h2>
          <div class="bio-links" style="flex-direction: column; gap: 14px; margin-top: 0;">
            <ul>
              <li><a href="mailto:Shethuday505@gmail.com">Shethuday505@gmail.com</a></li>
              <li><a href="tel:+919408753008">+91 94087 53008</a></li>
            </ul>
          </div>
          <p style="margin-top: 24px; opacity: 0.8; font-size: 0.95rem;">
            Based in Rajkot, Gujarat, India. <br> Open to remote and on-site work.
          </p>
        </div>
      </div>
    </section>
